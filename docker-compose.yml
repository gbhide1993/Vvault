services:

  db:
    image: ankane/pgvector
    container_name: vvault_db
    environment:
      POSTGRES_DB: vvault
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: ${DB_PASSWORD}
    ports:
      - "5432:5432"
    volumes:
      - ./db/init.sql:/docker-entrypoint-initdb.d/init.sql
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d vvault"]
      interval: 5s
      timeout: 5s
      retries: 20
      start_period: 30s

  backend:
    build:
      context: .
      dockerfile: Dockerfile.backend.prod
    container_name: vvault_backend
    depends_on:
      db:
        condition: service_healthy
      ollama:
        condition: service_healthy
    env_file:
      - .env  
    environment:
      DB_HOST: db
      DB_NAME: vvault
      DB_USER: postgres
      DB_PASSWORD: ${DB_PASSWORD}
      DB_PORT: 5432
    ports:
      - "8000:8000"
    

    volumes:
      - ./license:/app/license:ro
    healthcheck:
      test: ["CMD-SHELL", "python -c \"import urllib.request; urllib.request.urlopen('http://localhost:8000/health')\" || exit 1"]
      interval: 15s
      timeout: 10s
      retries: 5
      start_period: 30s

  frontend:
      build: ./frontend
      ports:
        - "3000:80"
        - "3443:443"
      depends_on:
        backend:
          condition: service_healthy
      volumes:
        - ./certs:/etc/nginx/certs:ro


  ollama:
    image: ollama/ollama
    container_name: vvault_ollama
    environment:
      - OLLAMA_KEEP_ALIVE=60m
      - OLLAMA_NUM_PARALLEL=1
    ports:
      - "127.0.0.1:11434:11434"
    volumes:
      - ollama_data:/root/.ollama
    entrypoint: >
      sh -c "
      ollama serve &
      sleep 5 &&
      ollama pull phi3:mini &&
      ollama pull nomic-embed-text &&
      wait
      "
    healthcheck:
      test: ["CMD-SHELL", "ollama list | grep -q phi3 || exit 1"]
      interval: 10s
      retries: 30
      start_period: 20s

volumes:
  pgdata:
  ollama_data: