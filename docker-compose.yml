services:

  db:
    image: ankane/pgvector
    container_name: vvault_db
    environment:
      POSTGRES_DB: vvault
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: ${DB_PASSWORD}
    ports:
      - "5432:5432"
    volumes:
      - ./db/init.sql:/docker-entrypoint-initdb.d/init.sql
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d vvault"]
      interval: 5s
      timeout: 5s
      retries: 20
      start_period: 30s

  backend:
    build:
      context: .
      dockerfile: Dockerfile.backend.prod
    container_name: vvault_backend
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
      ollama:
        condition: service_started
    env_file:
      - .env
    environment:
      DB_HOST: db
      DB_NAME: vvault
      DB_USER: postgres
      DB_PASSWORD: ${DB_PASSWORD}
      DB_PORT: 5432
    ports:
      - "8000:8000"


    volumes:
      - ./license:/app/license:ro
    healthcheck:
      test: ["CMD-SHELL", "python -c \"import urllib.request; urllib.request.urlopen('http://localhost:8000/health')\" || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 10
      start_period: 240s

  frontend:
      build: ./frontend-react
      ports:
        - "3000:80"
        - "3443:443"
      depends_on:
        backend:
          condition: service_healthy
      volumes:
        - ./certs:/etc/nginx/certs:ro


  ollama:
    image: ollama/ollama
    container_name: vvault_ollama
    restart: unless-stopped
    mem_limit: 8g
    mem_reservation: 5g
    environment:
      - OLLAMA_KEEP_ALIVE=24h
      
      - OLLAMA_MAX_LOADED_MODELS=2
      - OLLAMA_FLASH_ATTENTION=1
    ports:
      - "127.0.0.1:11434:11434"
    volumes:
      - ollama_data:/root/.ollama
    entrypoint: >
      sh -c "
      ollama serve &
      sleep 5 &&
      ollama pull qwen2.5:1.5b &&
      ollama pull nomic-embed-text &&
      ollama run qwen2.5:1.5b 'hello' &&
      ollama run nomic-embed-text 'hello' &&
      wait
      "

volumes:
  pgdata:
  ollama_data: